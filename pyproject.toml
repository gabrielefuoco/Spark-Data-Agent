[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spark-data-agent"
version = "0.1.0"
description = "Conversational analytics over the eRISK corpus: a PySpark Medallion lakehouse behind a LangGraph agent with deterministic statistical guards."
readme = "CONTEXT.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "pyspark>=3.5.0,<4",
    # PySpark 3.5 predates pandas 3: its pandas API still imports
    # DateOffset from pandas.tseries.frequencies, removed in pandas 3. Pandera's
    # pyspark backend imports that API unconditionally, so without this cap the
    # whole validation layer fails to import.
    "pandas>=2.0,<3",
    # PyArrow is what pyspark.pandas (imported by pandera) needs to exist at all.
    # NumPy stays below 2 because PySpark 3.5 still references np.NaN, removed in
    # NumPy 2, and PyArrow is capped below 17 because those builds refuse to
    # load under NumPy 1.x. Together these three form the only consistent set.
    "numpy>=1.26,<2",
    "pyarrow>=14,<17",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlglot>=25.0",
    "pandera[pyspark]>=0.20",
    "scipy>=1.13",
    "streamlit>=1.38",
    "plotly>=5.22",
    "langgraph>=0.2",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# `legacy/` is the pre-rewrite implementation, kept verbatim as the evidence of
# the defects the tickets remove: linting it would be linting the crime scene.
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "spark: tests requiring a local SparkSession",
]
