[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spark-data-agent"
version = "0.1.0"
description = "Conversational analytics over the eRISK corpus: a PySpark Medallion lakehouse behind a LangGraph agent with deterministic statistical guards."
readme = "CONTEXT.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "pyspark>=3.5.0,<4",
    # PySpark 3.5 predates pandas 3: its pandas API still imports
    # DateOffset from pandas.tseries.frequencies, removed in pandas 3. Pandera's
    # pyspark backend imports that API unconditionally, so without this cap the
    # whole validation layer fails to import.
    "pandas>=2.0,<3",
    # PyArrow is what pyspark.pandas (imported by pandera) needs to exist at all.
    # NumPy stays below 2 because PySpark 3.5 still references np.NaN, removed in
    # NumPy 2, and PyArrow is capped below 17 because those builds refuse to
    # load under NumPy 1.x. Together these three form the only consistent set.
    "numpy>=1.26,<2",
    "pyarrow>=14,<17",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlglot>=25.0",
    "pandera[pyspark]>=0.20",
    "scipy>=1.13",
    "streamlit>=1.38",
    "plotly>=5.22",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    # Works against both backends: Ollama's /v1 endpoint and OpenRouter are both
    # OpenAI-compatible, so one client covers local and remote.
    "langchain-openai>=0.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "spark: tests requiring a local SparkSession",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
# Not `strict = true`: the PySpark, Pandera, sqlglot and LangChain stubs are
# partial, so strict mode would mostly report their gaps instead of our bugs.
# The flags below are the strictness this codebase (24 modules, all annotated)
# actually holds.
strict = false
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
# PySpark, Pandera and LangChain ship partial or untyped metadata.
ignore_missing_imports = true
